<div class="container">
  <div class="card">
    <h2>Find your bus</h2>
    <p style="color: var(--muted); margin-top: -8px;">Search without logging in - sign in only when you are ready to book.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row">
        <div class="form-group">
          <label>From</label>
          <input type="text" formControlName="source" placeholder="e.g. Delhi" />
        </div>
        <div class="form-group">
          <label>To</label>
          <input type="text" formControlName="destination" placeholder="e.g. Dehradun" />
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label>Preferred departure after (optional)</label>
          <input type="datetime-local" formControlName="departureAfter" />
        </div>
        <div class="form-group">
          <label>Preferred arrival before (optional)</label>
          <input type="datetime-local" formControlName="arrivalBefore" />
        </div>
      </div>
      <button class="btn" type="submit">Search Buses</button>
    </form>
  </div>

  <div class="card">
    <strong>Try it out:</strong> Delhi → Dehradun, Delhi → Manali, Delhi → Jaipur, or Dehradun → Delhi (from the seeded demo data).
  </div>
</div>
