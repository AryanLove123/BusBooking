<div class="container" style="max-width: 420px;">
  <div class="card">
    <h2>Login</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <div class="error-text">A valid email is required.</div>
        }
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Password" />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <div class="error-text">Password is required.</div>
        }
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? "Logging in..." : "Login" }}</button>
    </form>
    <p style="margin-top: 16px; font-size: 14px;">
      No account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
