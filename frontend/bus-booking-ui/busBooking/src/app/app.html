<nav class="top-nav">
    <div class="container nav-container">
        <div class="nav-left">
            <a routerLink="/" class="brand">🚌 BusBooking</a>
            <div class="nav-links">
                @if(authService.isLoggedIn()){
                <a routerLink="/view-bookings" routerLinkActive="active">My Bookings</a>
                }
                @if(authService.isAdmin()){
                <a routerLink="/admin" routerLinkActive="active">Admin</a>
                }
            </div>
        </div>
        <div class="nav-right">
            @if(authService.isLoggedIn()){
            <div class="user-profile">
                <span class="user-greeting">Hi, <strong>{{authService._currentUser()?.name}}</strong></span>
                <button class="btn-logout" (click)="logout()">Logout</button>
            </div>
            } @else {
            <div class="auth-links">
                <a routerLink="/login" class="nav-link">Login</a>
                <a routerLink="/register" class="btn small" style="color: #fff; background-color: #3498db;">Register</a>
            </div>
            }
        </div>
    </div>
</nav>

<div class="toast-container"
    style="position: fixed; top: 16px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap:8px;">
    @for(n of notify.notifications(); track n.id ){
    <div class="card" [style.border-left]="n.type === 'success' ? '4px solid #2f855a' : '4px solid #c0392b'"
        style="min-width: 260px; margin-bottom: 0; padding: 12px 16px;">
        {{ n.message }}
    </div>
    }
</div>

<router-outlet></router-outlet>
